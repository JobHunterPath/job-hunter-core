[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-hunter-core"
version = "0.1.0"
description = "Private core automation for job discovery, resume tailoring, cover letters, and LinkedIn support."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.50.0",
  "openai>=1.68.0",
  "google-genai>=1.0.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "keyring>=24.0.0",
  "pyyaml>=6.0",
  "reportlab>=4.0.0",
  "playwright>=1.40.0",
  "python-jobspy>=0.20.0",
]

[project.scripts]
job-hunter = "core.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["core*", "discovery*", "linkedin*", "pipeline*", "sources*", "tracking*"]
