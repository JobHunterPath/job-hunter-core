linkedin:
  enabled: false
  positioning: "Product professional focused on technical products, platform work, and practical product execution."

  audience:
    - hiring managers
    - product leaders
    - recruiters
    - technical PMs

  content_pillars:
    - product management
    - technical product work
    - platform product management
    - stakeholder management
    - learning in public
    - side projects

  tone:
    - concrete
    - honest
    - practical
    - concise
    - no influencer voice

  forbidden_phrases:
    - "I am passionate about"
    - "thrilled to share"
    - "game changer"
    - "thought leader"
    - "10x"
    - "pick your brain"
    - "please refer me"

  confidentiality:
    forbidden_public_details:
      - internal product names unless explicitly approved
      - unreleased roadmap details
      - vendor/provider names not publicly confirmed
      - incident details
      - internal team structures
      - private stakeholder names
      - exact internal process details
      - confidential metrics

  files:
    ideas: "linkedin/ideas.md"
    drafts_dir: "linkedin/drafts"
    networking: "linkedin/networking.md"

  idea_generation:
    ideas_per_run: 8
    source: story_bank

  draft_generation:
    posts_per_run: 2
    source_status: raw
    mark_converted: true
    max_words_per_post: 180

  networking_discovery:
    results_per_query: 5
    region:
      country: DE
      search_lang: en
      location: Berlin

  networking:
    max_message_words: 70
