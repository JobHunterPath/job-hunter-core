cover_letter:
  candidate_background: |
    Candidate Name, Target Role based in Target City.
    Background: Replace this with your current role, target positioning, verified achievements, and relevant education.
    Keep this section factual because the cover letter generator treats it as source material.

  structure:
    paragraph_1:
      name: "Background and role connection"
      max_sentences: 3
      purpose: "Open with the candidate's professional background and connect to the role."
      example_opening: "I am a candidate with experience in [relevant domain], which connects directly to this role."
    paragraph_2:
      name: "Current or recent role"
      max_sentences: 4
      purpose: "Describe ownership scope and one verified outcome."
      example_opening: "In my recent role, I owned [scope] and delivered [verified outcome]."
    paragraph_3:
      name: "Earlier experience with verified outcomes"
      max_sentences: 4
      purpose: "Use another story with concrete scope or metric."
      example_opening: "Earlier, I worked on initiatives where clear prioritisation and stakeholder alignment mattered."
    paragraph_4:
      name: "Specific interest in this company"
      max_sentences: 3
      purpose: "Make one concrete observation from the job description."
      example_opening: "The role stands out because it connects my verified experience with the work described in the job description."

  tone:
    - "professional and formal"
    - "confident and substantive"
    - "direct"
    - "active voice"
    - "complete grammatical sentences"

  forbidden:
    style:
      - "No em dashes (—) — rewrite the sentence instead"
      - "No casual phrases: 'Happy to discuss', 'Feel free to reach out', 'I would love to'"
      - "No sycophancy: no flattery of the company or its mission"
      - "No invented or extrapolated facts — only what is explicitly in the story library"
      - "No fragments as opening sentences — use complete sentences"
    phrases:
      - "I am passionate about"
      - "I am excited to apply"
      - "I am honored"
      - "I am thrilled"
      - "I thrive in"
      - "I look forward to hearing from you"
      - "Thank you for your time"
      - "at your earliest convenience"
      - "Happy to discuss"
      - "Feel free to reach out"
      - "I would love to"
      - "Kind regards"
      - "I can start immediately"
      - "I am available from"

  closing:
    format: "Best regards,\nCandidate Name"

  stories:
    source_file: "story_bank.md"
    section: "Final - refined STAR stories"
    rules:
      - "Use only metrics and facts stated explicitly in the story library"
      - "Never invent, extrapolate, or embellish — every claim must be justifiable"
      - "Do NOT cite story IDs or include bracketed references like [STORY-01]"

  header:
    include_date: true
    date_format: "%B %d, %Y"
    salutation: "Dear Hiring Manager,"

  content:
    target_words: 220
    max_words: 280
    paragraphs: 4
