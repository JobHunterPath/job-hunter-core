# API and LLM configuration for the shareable template repo.
# Store real secret values in environment variables, GitHub Actions secrets, or
# your local keyring. Do not commit API keys.

llm:
  # The maintained core image includes the supported provider SDKs.
  default_provider: anthropic
  providers:
    validation: anthropic
    scoring: anthropic
    tailoring: anthropic
    cover_letter: anthropic
    discovery: anthropic
    linkedin: anthropic
    jd_extraction: anthropic
    ai_web_search: anthropic
  models:
    # Model names must match the provider configured for each role above.
    # If you switch providers, replace these with model names from that provider.
    validation: "claude-haiku-4-5-20251001"
    scoring: "claude-haiku-4-5-20251001"
    tailoring: "claude-sonnet-4-6"
    cover_letter: "claude-sonnet-4-6"
    discovery: "claude-sonnet-4-6"
    linkedin: "claude-sonnet-4-6"
    jd_extraction: "claude-haiku-4-5-20251001"
    ai_web_search: "claude-haiku-4-5-20251001"  # may 529 at peak hours; switch to sonnet if reliability matters more than cost
  max_tokens:
    validation: 200
    scoring: 1000
    tailoring: 4000
    cover_letter: 800
    discovery: 400
    linkedin: 6000
    jd_extraction: 1500
    ai_web_search: 1200

ollama:
  base_url: "http://localhost:11434"

secrets:
  # Set the env_var value to match the environment variable name where your key lives.
  anthropic:
    env_var: "ANTHROPIC_API_KEY"
  openai:
    env_var: "OPENAI_API_KEY"
  google:
    env_var: "GOOGLE_API_KEY"
  brave:
    env_var: "BRAVE_API_KEY"
  tavily:
    env_var: "TAVILY_API_KEY"
  exa:
    env_var: "EXA_API_KEY"
  firecrawl:
    env_var: "FIRECRAWL_API_KEY"
  rapidapi:
    env_var: "RAPIDAPI_KEY"
  jooble:
    env_var: "JOOBLE_API_KEY"

http:
  api_budgets:
    # Monthly call budgets for keyed search providers. When a provider exceeds
    # its limit the pipeline skips it silently for the rest of the month and
    # falls through to the next provider in the search order. Exhaustion
    # is distinguished from transient failures: a quota-exhausted provider does
    # not count toward the consecutive-failure limit and does not suppress the run.
    # Budget state auto-resets at the start of each calendar month.
    enabled: true
    state_path: "config/api_usage.json"
    monthly_limits:
      exa: 900
      tavily: 900
      brave: 900
      jsearch: 180
      adzuna: 2250
      jobicy: 1000
      jooble: 500
      firecrawl: 100

  search_providers:
    ats_discovery:
      # ATS discovery queries public ATS job APIs directly without any search
      # provider key. It runs regardless of whether SearXNG or Brave/Tavily/Exa
      # are available, so it is the primary no-key discovery path.
      enabled: true
      # All ATS platforms supported in code are listed here.
      # Remove entries you do not want queried; all are no-key/public-endpoint sources.
      sources:
        - greenhouse
        - lever
        - ashby
        - smartrecruiters
        - workable
        - personio
        - recruitee
        - hibob
        - teamtailor
        - breezy
        - workday
    ai_web_search:
      enabled: false
      # Queries are title + region only; company names are never included.
      # 0 preserves old behavior. Set above 0 to skip AI search when earlier sources find enough jobs.
      run_if_fewer_than_jobs: 0
      prompt_delay_seconds: 3         # pause between prompts to avoid overloading the web-search endpoint
      max_prompts_per_run: 80
      max_prompts_per_region: 8
      max_results_per_prompt: 8
      max_results_per_region: 30
      max_total_results_per_run: 120
      min_confidence: 0.5
      sources:
        greenhouse:
          enabled: true
          query_templates:
            - 'site:greenhouse.io "{title}" "{location}"'
        lever:
          enabled: true
          query_templates:
            - 'site:jobs.lever.co "{title}" "{location}"'
        ashby:
          enabled: true
          query_templates:
            - 'site:jobs.ashbyhq.com "{title}" "{location}"'
        smartrecruiters:
          enabled: true
          query_templates:
            - 'site:jobs.smartrecruiters.com "{title}" "{location}"'
        workable:
          enabled: true
          query_templates:
            - 'site:apply.workable.com "{title}" "{location}"'
        personio:
          enabled: true
          query_templates:
            - '(site:jobs.personio.de OR site:jobs.personio.com) "{title}" "{location}"'
        recruitee:
          enabled: true
          query_templates:
            - 'site:recruitee.com "{title}" "{location}"'
        hibob:
          enabled: true
          query_templates:
            - 'site:careers.hibob.com/jobs "{title}" "{location}"'
        generic_web:
          enabled: true
          query_templates:
            # Exclude aggregators to force individual company career pages and ATS postings.
            - '"{title}" "{location}" job apply -site:glassdoor.com -site:indeed.com -site:linkedin.com -site:monster.com -site:xing.com -site:stepstone.de'

  job_boards:
    arbeitnow:
      enabled: true
    jsearch:
      enabled: true
    adzuna:
      enabled: true
    reed:
      enabled: true
    jobspy:
      enabled: true
      hours_old: 72
    remotive:
      enabled: true
    the_muse:
      enabled: true
    jobicy:
      enabled: true
    remoteok:
      enabled: true
    weworkremotely:
      enabled: true
    jooble:
      enabled: true
    mycareersfuture:
      enabled: true
    eures:
      enabled: true
    jobbank:
      enabled: true
    wttj:
      enabled: true
    glints:
      enabled: true
    irishjobs:
      enabled: true
    gulftalent:
      enabled: true
    naukrigulf:
      enabled: true
    jobstreet:
      enabled: true

profile:
  # Available resume templates:
  # - resume_double_column.tex: AltaCV double-column layout
  # - resume_single_column.tex: ATS-friendly single-column layout
  resume_tex: "resume_double_column.tex"
  story_bank: "story_bank.md"
  profile_image: ""
  latex_class: "altacv.cls"
  output_dir: "jobs"
