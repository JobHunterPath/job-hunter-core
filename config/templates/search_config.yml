regions:
  berlin:
    enabled: true
    primary: true
    country: "DE"
    search_lang: "en"
    location: "Berlin"
    description: "Primary search region"
    job_titles:
      - "Product Manager"
      - "Product Owner"
    companies:
      - name: Example SaaS Company
        career_url: boards.greenhouse.io/example
      - name: Example Lever Company
        career_url: jobs.lever.co/example
      - name: Example Careers Site
        career_url: careers.example.com

scraping:
  max_workers: 10              # companies processed in parallel
  total_timeout_seconds: 1800  # 30 min ceiling for company scraping phase
  cache_revalidation:
    # When enabled, the scraper re-checks URLs stored in config/discovery_cache.yml
    # if live sources return fewer results than `threshold`. This is a no-key fallback:
    # it costs no API credits and works even when Brave/Tavily/Exa are exhausted.
    # Enable once you have run discovery at least once and the cache has entries.
    enabled: false             # re-check cached discovery URLs when live yield is thin
    threshold: 5               # only activates when fewer than this many live results found
    max_urls: 20               # upper bound on cached URLs checked per run

global_search:
  results_per_query: 10
  job_titles:
    - "Product Manager"
    - "Product Owner"

exclusion_rules:
  exclude_german_language: true
  excluded_url_patterns:
    - "linkedin\\.com/jobs/search"
    - "linkedin\\.com/jobs/[^/?#]+-jobs"
    - "linkedin\\.com/jobs/collections"
    - "linkedin\\.com/jobs/remote-"
    - "linkedin\\.com/jobs/[a-z]+-stellen"
    - "linkedin\\.com/jobs/[a-z]+-stellenangebote"
  excluded_title_terms:
    - engineer
    - engineering
    - developer
    - software
    - frontend
    - backend
    - full stack
    - fullstack
    - devops
    - data scientist
    - designer
    - ux
    - ui
    - working student
    - werkstudent
    - student
    - intern
    - internship
    - praktikum
    - praktikant
    - trainee
  excluded_industries:
    - "gambling"
    - "casino"
    - "weapons"
    - "defence"
    - "military"
    - "banking"
    - "credit institution"
    - "fintech lending"
  senior_flags:
    - "director"
    - "vp "
    - "vice president"
    - "head of product"
    - "chief product"
  stale_indicators:
    - "no longer available"
    - "this job has expired"
    - "position has been filled"
    - "not accepting applications"
  german_indicators:
    - wir suchen
    - wir freuen uns
    - jetzt bewerben
    - ihre aufgaben
    - ihr profil
    - deine aufgaben
    - dein profil
    - was wir bieten
    - was du mitbringst
    - das bieten wir
    - stellenangebot
    - berufserfahrung
    - deutschkenntnisse

discovery:
  max_workers: 10
  total_timeout_seconds: 1800
  reserve_seconds: 600
  overlap_scope: new_only
  # LLM discovery uses these simple sector names. ATS/search discovery also
  # runs from your configured regions and job titles.
  # To run company discovery without LLM sector suggestions, clear this list
  # (set sectors: []). The pipeline will use ATS-posting discovery only, which
  # finds real companies from live job postings without any LLM calls or API keys.
  sectors:
    - "automotive & mobility"
    - "commercial aviation & travel tech"
    - "industrial automation & enterprise SaaS"
    - "health tech & life sciences"
    - "climate tech & energy"
    - "logistics & supply chain tech"
    - "developer tools & cloud infrastructure"
    - "marketplace & e-commerce tech"
    - "insurtech & regtech"
    - "education tech & HR tech"
    - "proptech & smart building"
    - "cybersecurity & privacy tech"
    - "{location} tech startups & scale-ups"

excluded_companies:
  - "Example Excluded Company"
