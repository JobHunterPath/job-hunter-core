regions:
  your_city:
    enabled: true
    primary: true
    country: "DE"          # ISO 3166-1 alpha-2 country code
    search_lang: "en"
    location: "Your City"  # City name passed to job board APIs
    description: "Primary search region"

  # --- Optional region examples for new job board sources ---
  # Uncomment and adjust to activate. Each region auto-enables the boards
  # that match its country code (e.g. SG → MyCareersFuture + Glints + JobStreet).

  # singapore:
  #   enabled: false
  #   country: "SG"
  #   location: "Singapore"

  # ireland:
  #   enabled: false
  #   country: "IE"
  #   location: "Dublin"

  # canada:
  #   enabled: false
  #   country: "CA"
  #   location: "Toronto"

  # uae:
  #   enabled: false
  #   country: "AE"
  #   location: "Dubai"

  # saudi_arabia:
  #   enabled: false
  #   country: "SA"
  #   location: "Riyadh"

global_search:
  job_titles:
    - "Product Manager"
    - "Product Owner"

llm_job_search:
  enabled: false
  trigger_threshold: 15   # run LLM search if fewer than N candidates found
  max_results_per_run: 20

exclusion_rules:
  # Drop listings written in these languages
  excluded_languages:
    - german

  # User-configurable indicators per language (supplement the built-in heuristics)
  language_indicators:
    german:
      - wir suchen
      - wir freuen uns
      - jetzt bewerben
      - ihre aufgaben
      - ihr profil
      - deine aufgaben
      - dein profil
      - was wir bieten
      - was du mitbringst
      - das bieten wir
      - stellenangebot
      - berufserfahrung
      - deutschkenntnisse

  excluded_url_patterns:
    - "linkedin\\.com/jobs/search"
    - "linkedin\\.com/jobs/[^/?#]+-jobs"
    - "linkedin\\.com/jobs/collections"
    - "linkedin\\.com/jobs/remote-"
    - "linkedin\\.com/jobs/[a-z]+-stellen"
    - "linkedin\\.com/jobs/[a-z]+-stellenangebote"

  excluded_title_terms:
    - engineer
    - engineering
    - developer
    - software
    - frontend
    - backend
    - full stack
    - fullstack
    - devops
    - data scientist
    - designer
    - ux
    - ui
    - working student
    - werkstudent
    - student
    - intern
    - internship
    - praktikum
    - praktikant
    - trainee

  excluded_industries:
    - "gambling"
    - "casino"
    - "weapons"
    - "defence"
    - "military"
    - "banking"
    - "credit institution"
    - "fintech lending"

  senior_flags:
    - "director"
    - "vp "
    - "vice president"
    - "head of product"
    - "chief product"

  stale_indicators:
    - "no longer available"
    - "this job has expired"
    - "position has been filled"
    - "not accepting applications"

excluded_companies:
  - "Example Excluded Company"
