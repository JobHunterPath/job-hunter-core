tailoring:
  rules:
    allowed_modifications:
      - "summary_section_text"
      - "bullet_ordering_within_roles"
      - "keyword_synonyms_to_match_jd"
      - "active_project_section_selection_and_bullets"
    forbidden_modifications:
      - "inventing_new_metrics"
      - "inventing_new_skills"
      - "inventing_new_job_titles"
      - "inventing_new_companies"
      - "inventing_new_time_periods"
    summary:
      max_lines: 4
      no_em_dashes: true
      tone: "confident, technical, results-oriented"
    bullets:
      min_per_role: 3
      max_per_role: 5
      max_lines_per_bullet: 2
      required_verb_tense: "past"
      forbidden_repeated_verbs_count: 2
    projects:
      enabled_when_section_active: true
      never_uncomment_project_section: true
      never_add_projects_to_fill_space: true
      max_projects: 4
      min_bullets_per_project: 3
      max_bullets_per_project: 5
      max_lines_per_bullet: 2
      max_total_resume_pages: 2
      remove_least_relevant_if_overflow_risk: true
      allowed_story_id_prefixes:
        - "TECH"
        - "UNI"
        - "SIDE"
        - "THESIS"
      selection_criteria:
        - "direct_relevance_to_job_description"
        - "PM_or_PO_relevance"
        - "technical_depth_relevant_to_role"
        - "verified_story_bank_source"
    preserve_latex: true
    preserve_formatting: true
    preserve_commands: true

  keyword_strategy:
    aggressiveness: "natural"
    priority_keywords:
      - "product strategy"
      - "cross-functional leadership"
      - "data-driven decisions"
      - "platform thinking"
    avoid_keywords:
      - "junior"
      - "intern"
      - "entry-level"

  stories:
    story_bank: "story_bank.md"
    max_chars_for_tailoring: 16000
    gap_coverage: "medium"
    strict_no_fabrication: true

performance_tracking:
  enabled: false
  track:
    - "interviews_per_job_score"
    - "keyword_relevance_feedback"
    - "hiring_manager_comments"
