name: Tailor From Raw Job Description

on:
  workflow_dispatch:
    inputs:
      jd:
        description: "Job description text"
        required: true
        type: string
      title:
        description: "Job title, including company name when useful"
        required: true
        type: string
      skip_score:
        description: "Skip scoring threshold and tailor regardless of fit score"
        required: false
        default: false
        type: boolean
      skip_validate:
        description: "Skip URL reachability and freshness validation"
        required: false
        default: false
        type: boolean
      force:
        description: "Re-tailor if this JD was already processed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tailor-raw-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Resolve prebuilt runner image
        id: runner_image
        shell: bash
        env:
          CORE_IMAGE: ${{ vars.JOB_HUNTER_CORE_IMAGE || 'ghcr.io/jobhunterpath/job-hunter-core:latest' }}
        run: |
          set -euo pipefail
          image="${CORE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          docker pull "$image"
          echo "Using job-hunter core image: $image"

      - name: Cache SearXNG image
        uses: actions/cache@v5
        with:
          path: /tmp/searxng.tar
          key: searxng-${{ hashFiles('.github/searxng/settings.yml') }}

      - name: Load or pull SearXNG image
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/searxng.tar ]; then
            docker load -i /tmp/searxng.tar
          else
            docker pull ghcr.io/searxng/searxng:latest
            docker save ghcr.io/searxng/searxng:latest -o /tmp/searxng.tar
          fi

      - name: Start SearXNG
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Build flags
        id: inputs
        shell: bash
        env:
          SKIP_SCORE: ${{ github.event.inputs.skip_score }}
          SKIP_VALIDATE: ${{ github.event.inputs.skip_validate }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          flags=()
          [ "$SKIP_SCORE" = "true" ] && flags+=("--skip-score")
          [ "$SKIP_VALIDATE" = "true" ] && flags+=("--skip-validate")
          [ "$FORCE" = "true" ] && flags+=("--force")

          {
            printf "flags="
            printf "%q " "${flags[@]}"
            printf "\n"
          } >> "$GITHUB_OUTPUT"

      - name: Run tailor raw
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          RAW_JD: ${{ github.event.inputs.jd }}
          RAW_TITLE: ${{ github.event.inputs.title }}
          LOG_LEVEL: INFO
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GOOGLE_API_KEY \
            -e BRAVE_API_KEY \
            -e TAVILY_API_KEY \
            -e EXA_API_KEY \
            -e SEARXNG_BASE_URL \
            -e RAW_JD \
            -e RAW_TITLE \
            -e LOG_LEVEL \
            -e JOB_HUNTER_ROOT=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            bash -lc 'printf "%s" "$RAW_JD" | job-hunter tailor-raw --jd - --title "$RAW_TITLE" ${{ steps.inputs.outputs.flags }}'

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tailor-raw-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit generated outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"

          git add README.md config/applied_jobs.yml config/search_config.yml
          find jobs -maxdepth 2 -type f \( \
            -name meta.json -o \
            -name jd.md -o \
            -name cover_letter.md -o \
            -name resume_tailored.tex -o \
            -name resume_tailored.pdf -o \
            -name cover_letter.pdf -o \
            -name altacv.cls -o \
            -iname '*.png' -o \
            -iname '*.jpg' -o \
            -iname '*.jpeg' -o \
            -iname '*.webp' \
          \) -print0 | xargs -0 -r git add --

          if git diff --staged --quiet; then
            echo "No generated outputs to commit."
            exit 0
          fi

          git commit -m "tailor(raw): $(date +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort || true
            sleep "$((attempt * 2))"
          done

          echo "::error::Could not rebase and push tailor-raw outputs after 3 attempts."
          exit 1
