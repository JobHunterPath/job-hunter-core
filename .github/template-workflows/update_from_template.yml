name: Update From Template

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-from-template-${{ github.ref }}
  cancel-in-progress: false

env:
  TEMPLATE_REPO: JobHunterPath/job-hunter-template

jobs:
  update-from-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout member repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Clone latest template
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 "https://github.com/${TEMPLATE_REPO}.git" template-source

      - name: Create update branch
        shell: bash
        run: |
          set -euo pipefail

          branch="template/update-${GITHUB_RUN_ID}"
          git checkout -B "$branch"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Apply safe template files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .github/workflows .github/searxng .github/scripts
          rm -f \
            .github/workflows/daily_jobs.yml \
            .github/workflows/update_from_core.yml \
            .github/workflows/sync_template_repo.yml \
            .github/workflows/publish_core.yml \
            .github/workflows/publish_template.yml \
            .github/workflows/build_runner_image.yml

          cp template-source/.gitignore .gitignore
          python3 template-source/.github/scripts/merge_upstream.py \
            template-source/README.md \
            README.md \
            README.md
          cp template-source/SETUP.md SETUP.md
          cp template-source/altacv.cls altacv.cls
          cp template-source/.github/searxng/settings.yml .github/searxng/settings.yml
          cp -r template-source/.github/scripts/. .github/scripts/

          cp template-source/.github/workflows/job_hunt.yml .github/workflows/job_hunt.yml
          cp template-source/.github/workflows/company_discovery.yml .github/workflows/company_discovery.yml
          cp template-source/.github/workflows/tailor_links.yml .github/workflows/tailor_links.yml
          cp template-source/.github/workflows/tailor_raw.yml .github/workflows/tailor_raw.yml
          if [ -f .github/workflows/linkedin_content.yml ]; then
            cp template-source/.github/workflows/linkedin_content.yml.disabled .github/workflows/linkedin_content.yml
          else
            cp template-source/.github/workflows/linkedin_content.yml.disabled .github/workflows/linkedin_content.yml.disabled
          fi
          cp template-source/.github/workflows/update_from_template.yml .github/workflows/update_from_template.yml

      - name: Preserve custom cron schedules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          def active_cron_count(text):
              return len(re.findall(r'^    - cron:', text, re.MULTILINE))

          def restore_schedule(new_text, old_text):
              old_block = re.search(r'  schedule:\n(?:    [^\n]*\n)*', old_text)
              if not old_block:
                  return new_text
              return re.sub(r'  schedule:\n(?:    [^\n]*\n)*', old_block.group(0), new_text, count=1)

          for wf in ['.github/workflows/job_hunt.yml', '.github/workflows/linkedin_content.yml']:
              path = Path(wf)
              if not path.exists():
                  continue
              try:
                  old_text = subprocess.check_output(['git', 'show', f'HEAD:{wf}'], text=True)
              except subprocess.CalledProcessError:
                  continue
              new_text = path.read_text(encoding='utf-8')
              if active_cron_count(old_text) > active_cron_count(new_text):
                  patched = restore_schedule(new_text, old_text)
                  if patched != new_text:
                      path.write_text(patched, encoding='utf-8')
                      print(f"Preserved existing schedule block in {wf}")
          PY

      - name: Merge config defaults
        shell: bash
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          mkdir -p config

          for template_file in template-source/config/*.yml; do
            name="$(basename "$template_file")"
            python3 template-source/.github/scripts/migrate_config.py \
              "$template_file" \
              "config/$name" \
              "config/$name"
          done

          rm -f template_update_summary.md

      - name: Migrate linkedin config
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("linkedin/config.yml")
          if not path.exists():
              exit(0)

          text = path.read_text(encoding="utf-8")
          original = text

          text = text.replace("  engagement_discovery:", "  networking_discovery:")
          text = re.sub(r'    engagement: "[^"]*"\n', '', text)
          text = text.replace("engagement_discovery_per_week:", "networking_discovery_per_week:")
          text = re.sub(r'    linkedin_domains:\n(?:      [^\n]*\n)+', '', text)

          text = re.sub(r'  automation_policy:\n(?:    [^\n]*\n)+', '', text)
          text = re.sub(r'  cadence:\n(?:    [^\n]*\n)+', '', text)
          text = re.sub(r'    mode: [^\n]*\n', '', text)
          text = re.sub(r'    story_bank_is_confidential: [^\n]*\n', '', text)
          text = re.sub(r'    public_safe_generation: [^\n]*\n', '', text)
          text = re.sub(r'    allowed_transformations:\n(?:      [^\n]*\n)+', '', text)
          text = re.sub(r'    no_job_ask: [^\n]*\n', '', text)
          text = re.sub(r'    no_referral_ask: [^\n]*\n', '', text)
          text = re.sub(r'    relationship_types:\n(?:      [^\n]*\n)+', '', text)
          text = re.sub(r'    ask_readiness:\n(?:      [^\n]*\n)+', '', text)

          if text != original:
              path.write_text(text, encoding="utf-8")
              print("Migrated linkedin/config.yml: removed dead config blocks")
          PY

          rm -f linkedin/engagement.md

      - name: Commit template update
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "job-hunter-template-bot"
          git config user.email "job-hunter-template-bot@users.noreply.github.com"

          tag="$(git -C template-source describe --tags --abbrev=0 2>/dev/null || echo '')"
          commit_msg="chore(template): update from JobHunterPath/job-hunter-template${tag:+ $tag}"

          git add -- \
            .gitignore README.md SETUP.md altacv.cls \
            .github/workflows .github/searxng .github/scripts \
            config
          git add -- linkedin/config.yml 2>/dev/null || true
          git rm --ignore-unmatch -- linkedin/engagement.md 2>/dev/null || true
          git rm --cached --ignore-unmatch -- template_update_summary.md

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No template updates found."
            exit 0
          fi

          git commit -m "$commit_msg"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open update pull request
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git push origin "HEAD:${branch}"

          gh pr create \
            --title "Update from job-hunter-template" \
            --body "" \
            --base main \
            --head "$branch"
