name: Job Hunt

on:
  schedule:
    # Slot 0: primary region, Monday through Friday.
    # Slots 1–9: secondary regions, Monday, Wednesday, and Friday only.
    - cron: "0 0 * * 1-5"
    # - cron: "0 1 * * 1,3,5"
    # - cron: "0 2 * * 1,3,5"
    # - cron: "0 3 * * 1,3,5"
    # - cron: "0 4 * * 1,3,5"
    # - cron: "0 5 * * 1,3,5"
    # - cron: "0 6 * * 1,3,5"
    # - cron: "0 7 * * 1,3,5"
    # - cron: "0 8 * * 1,3,5"
    # - cron: "0 9 * * 1,3,5"
  workflow_dispatch:
    inputs:
      region:
        description: "Region key to hunt: all, scheduled, or a search_config.yml region such as primary"
        required: false
        default: "all"
        type: string

permissions:
  contents: write

concurrency:
  group: job-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Resolve prebuilt runner image
        id: runner_image
        shell: bash
        env:
          CORE_IMAGE: ${{ vars.JOB_HUNTER_CORE_IMAGE || 'ghcr.io/jobhunterpath/job-hunter-core:latest' }}
        run: |
          set -euo pipefail
          image="${CORE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          docker pull "$image"
          echo "Using job-hunter core image: $image"

      - name: Resolve hunt region
        id: hunt_region
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_REGION: ${{ github.event.inputs.region || 'scheduled' }}
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          HUNT_SCHEDULES=$(grep -E '^\s+- cron:' .github/workflows/job_hunt.yml \
            | sed 's/.*- cron: "\(.*\)".*/\1/')
          export HUNT_SCHEDULES
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e JOB_HUNTER_ROOT=/workspace \
            -e EVENT_NAME \
            -e EVENT_SCHEDULE \
            -e INPUT_REGION \
            -e HUNT_SCHEDULES \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            job-hunter resolve-hunt-region >> "$GITHUB_OUTPUT"

      - name: Skip empty region slot
        if: steps.hunt_region.outputs.should_run != 'true'
        run: echo "${{ steps.hunt_region.outputs.reason }}"

      - name: Cache SearXNG image
        if: steps.hunt_region.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/searxng.tar
          key: searxng-${{ hashFiles('.github/searxng/settings.yml') }}

      - name: Load or pull SearXNG image
        if: steps.hunt_region.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/searxng.tar ]; then
            docker load -i /tmp/searxng.tar
          else
            docker pull ghcr.io/searxng/searxng:latest
            docker save ghcr.io/searxng/searxng:latest -o /tmp/searxng.tar
          fi

      - name: Start SearXNG
        if: steps.hunt_region.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for _ in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Run job hunt
        if: steps.hunt_region.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          LOG_LEVEL: INFO
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GOOGLE_API_KEY \
            -e BRAVE_API_KEY \
            -e TAVILY_API_KEY \
            -e EXA_API_KEY \
            -e FIRECRAWL_API_KEY \
            -e SEARXNG_BASE_URL \
            -e RAPIDAPI_KEY \
            -e ADZUNA_APP_ID \
            -e ADZUNA_API_KEY \
            -e REED_API_KEY \
            -e LOG_LEVEL \
            -e JOB_HUNTER_ROOT=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            job-hunter hunt ${{ steps.hunt_region.outputs.arg }}

      - name: Upload logs as artifact
        if: always() && steps.hunt_region.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: job-hunt-logs-${{ steps.hunt_region.outputs.label }}-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit generated job outputs
        if: steps.hunt_region.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"

          git add README.md config/
          find jobs -maxdepth 2 -type f \( \
            -name meta.json -o \
            -name jd.md -o \
            -name cover_letter.md -o \
            -name resume_tailored.tex -o \
            -name resume_tailored.pdf -o \
            -name cover_letter.pdf -o \
            -name altacv.cls -o \
            -iname '*.png' -o \
            -iname '*.jpg' -o \
            -iname '*.jpeg' -o \
            -iname '*.webp' \
          \) -print0 | xargs -0 -r git add --

          if git diff --staged --quiet; then
            echo "No generated job outputs to commit."
            exit 0
          fi

          git commit -m "jobs(${{ steps.hunt_region.outputs.label }}): $(date +%Y-%m-%d)"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi

            git rebase --abort || true
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e JOB_HUNTER_ROOT=/workspace \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${{ steps.runner_image.outputs.image }}" \
              job-hunter merge-tracker
            git checkout origin/main -- README.md 2>/dev/null || true
            git add README.md config/
            if ! git diff --staged --quiet; then
              git commit --amend --no-edit
            fi
            sleep "$((attempt * 2))"
          done

          echo "::error::Could not rebase and push generated job outputs after 3 attempts."
          exit 1
