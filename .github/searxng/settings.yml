use_default_settings:
  engines:
    keep_only:
      - bing
      - brave
      - duckduckgo

search:
  formats:
    - html
    - json
  autocomplete: ""
  default_lang: "en"

server:
  secret_key: "github-actions-local-only"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  public_instance: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: true

# Engines tuned for GitHub Actions ephemeral runners.
# Google is disabled: its IPs are flagged as bot traffic on cloud runners and
# consistently return captcha/empty results, wasting a slot in every query.
# Bing handles site: operator reliably on cloud IPs and is the primary engine.
# DuckDuckGo and Brave provide fallback coverage with independent indexes.
engines:
  - name: google
    disabled: true
  - name: bing
    disabled: false
    weight: 3
  - name: duckduckgo
    disabled: false
    weight: 2
  - name: brave
    disabled: false
    weight: 2
