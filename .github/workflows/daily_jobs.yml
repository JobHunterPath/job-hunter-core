name: Job Hunt Pipeline

on:
  schedule:
    # Daily job hunt slots. Slot 0 is the primary region and runs every weekday.
    # Secondary regions run on Monday/Wednesday/Friday only. Keep one hunt cron
    # per configured region slot; discovery has its own separate Monday cron.
    - cron: '0 4 * * 1-5'
    - cron: '0 5 * * 1,3,5'
    - cron: '0 6 * * 1,3,5'
    - cron: '0 7 * * 1,3,5'
    - cron: '0 8 * * 1,3,5'
    - cron: '0 9 * * 1,3,5'
    - cron: '0 10 * * 1,3,5'
    - cron: '0 11 * * 1,3,5'
    - cron: '0 12 * * 1,3,5'
    - cron: '0 13 * * 1,3,5'
    - cron: '0 18 * * 1'     # company discovery Mondays 18:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'hunt'
        type: choice
        options:
          - hunt
          - discover
          - both
      region:
        description: 'Region key for hunt runs: all, scheduled, or a search_config.yml region such as berlin'
        required: false
        default: 'all'
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: daily-jobs-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.schedule || github.event.inputs.job || github.run_id }}
  cancel-in-progress: true

jobs:

  # ── Daily job hunt ─────────────────────────────────────────────────────────
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      (github.event_name == 'schedule' && github.event.schedule != '0 18 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'hunt' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Resolve prebuilt runner image
        id: runner_image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CORE_IMAGE_PAT || github.token }}
          CORE_IMAGE: ${{ vars.JOB_HUNTER_CORE_IMAGE || 'ghcr.io/abdulrbasit/abdul.basit_resume/job-hunter-core:latest' }}
        run: |
          image="${CORE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull "$image"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using job-hunter core image: $image"
          else
            echo "::error::Could not pull job-hunter core image: $image"
            echo "::error::Grant this repository package access or set CORE_IMAGE_PAT with read:packages."
            exit 1
          fi

      - name: Resolve hunt region
        id: hunt_region
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_REGION: ${{ github.event.inputs.region || 'all' }}
          HUNT_SCHEDULES: |
            0 4 * * 1-5
            0 5 * * 1,3,5
            0 6 * * 1,3,5
            0 7 * * 1,3,5
            0 8 * * 1,3,5
            0 9 * * 1,3,5
            0 10 * * 1,3,5
            0 11 * * 1,3,5
            0 12 * * 1,3,5
            0 13 * * 1,3,5
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e JOB_HUNTER_ROOT=/workspace \
            -e EVENT_NAME \
            -e EVENT_SCHEDULE \
            -e INPUT_REGION \
            -e HUNT_SCHEDULES \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            job-hunter resolve-hunt-region >> "$GITHUB_OUTPUT"

      - name: Skip empty region slot
        if: steps.hunt_region.outputs.should_run != 'true'
        run: echo "${{ steps.hunt_region.outputs.reason }}"

      - name: Cache SearXNG image
        if: steps.hunt_region.outputs.should_run == 'true'
        uses: actions/cache@v5
        with:
          path: /tmp/searxng.tar
          key: searxng-${{ hashFiles('.github/searxng/settings.yml') }}

      - name: Load or pull SearXNG image
        if: steps.hunt_region.outputs.should_run == 'true'
        run: |
          if [ -f /tmp/searxng.tar ]; then
            echo "Loading SearXNG from cache"
            docker load -i /tmp/searxng.tar
          else
            docker pull ghcr.io/searxng/searxng:latest
            docker save ghcr.io/searxng/searxng:latest -o /tmp/searxng.tar
          fi

      - name: Start SearXNG
        if: steps.hunt_region.outputs.should_run == 'true'
        run: |
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Run daily hunt in prebuilt runner image
        if: steps.hunt_region.outputs.should_run == 'true' && steps.runner_image.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          LOG_LEVEL: INFO
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GOOGLE_API_KEY \
            -e BRAVE_API_KEY \
            -e TAVILY_API_KEY \
            -e EXA_API_KEY \
            -e SEARXNG_BASE_URL \
            -e RAPIDAPI_KEY \
            -e LOG_LEVEL \
            -e JOB_HUNTER_ROOT=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            job-hunter hunt ${{ steps.hunt_region.outputs.arg }}

      - name: Upload logs as artifact
        if: always() && steps.hunt_region.outputs.should_run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: job-hunt-logs-${{ steps.hunt_region.outputs.label }}-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit results
        if: steps.hunt_region.outputs.should_run == 'true'
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add README.md config/applied_jobs.yml config/discovery_cache.yml
          find jobs -maxdepth 2 -type f \( \
            -name meta.json -o \
            -name jd.md -o \
            -name cover_letter.md -o \
            -name resume_tailored.tex -o \
            -name resume_tailored.pdf -o \
            -name cover_letter.pdf \
          \) -print0 | xargs -0 -r git add --
          git diff --staged --quiet || git commit -m "jobs(${{ steps.hunt_region.outputs.label }}): $(date +%Y-%m-%d)"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            git rebase --abort || true
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e JOB_HUNTER_ROOT=/workspace \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${{ steps.runner_image.outputs.image }}" \
              job-hunter merge-tracker
            git checkout origin/main -- README.md 2>/dev/null || true
            git add config/applied_jobs.yml config/discovery_cache.yml README.md
            git commit --amend --no-edit
          done
          git push

  # ── Weekly company discovery ────────────────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 18 * * 1') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'discover' || github.event.inputs.job == 'both'))

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Resolve prebuilt runner image
        id: runner_image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CORE_IMAGE_PAT || github.token }}
          CORE_IMAGE: ${{ vars.JOB_HUNTER_CORE_IMAGE || 'ghcr.io/abdulrbasit/abdul.basit_resume/job-hunter-core:latest' }}
        run: |
          image="${CORE_IMAGE}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

          if echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin && docker pull "$image"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Using job-hunter core image: $image"
          else
            echo "::error::Could not pull job-hunter core image: $image"
            echo "::error::Grant this repository package access or set CORE_IMAGE_PAT with read:packages."
            exit 1
          fi

      - name: Cache SearXNG image
        uses: actions/cache@v5
        with:
          path: /tmp/searxng.tar
          key: searxng-${{ hashFiles('.github/searxng/settings.yml') }}

      - name: Load or pull SearXNG image
        run: |
          if [ -f /tmp/searxng.tar ]; then
            echo "Loading SearXNG from cache"
            docker load -i /tmp/searxng.tar
          else
            docker pull ghcr.io/searxng/searxng:latest
            docker save ghcr.io/searxng/searxng:latest -o /tmp/searxng.tar
          fi

      - name: Start SearXNG
        run: |
          if ! docker run -d --name searxng \
            -p 8080:8080 \
            -v "${{ github.workspace }}/.github/searxng/settings.yml:/etc/searxng/settings.yml:ro" \
            -e SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml \
            ghcr.io/searxng/searxng:latest; then
            echo "SearXNG container failed to start; continuing with other providers"
            exit 0
          fi

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:8080/search?q=test&format=json" >/dev/null; then
              echo "SearXNG is ready"
              exit 0
            fi
            sleep 2
          done

          echo "SearXNG did not become ready; continuing with other providers"
          docker logs searxng || true

      - name: Discover new companies in prebuilt runner image
        if: steps.runner_image.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SEARXNG_BASE_URL: http://127.0.0.1:8080
          LOG_LEVEL: INFO
          RUNNER_IMAGE: ${{ steps.runner_image.outputs.image }}
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e ANTHROPIC_API_KEY \
            -e OPENAI_API_KEY \
            -e GOOGLE_API_KEY \
            -e BRAVE_API_KEY \
            -e TAVILY_API_KEY \
            -e EXA_API_KEY \
            -e SEARXNG_BASE_URL \
            -e LOG_LEVEL \
            -e JOB_HUNTER_ROOT=/workspace \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$RUNNER_IMAGE" \
            job-hunter discover

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: company-discovery-logs-${{ github.run_id }}
          path: job_hunt.log
          retention-days: 30

      - name: Commit updated search_config.yml
        run: |
          git config user.name "job-hunt-bot"
          git config user.email "bot@job-hunt"
          git add config/search_config.yml
          git diff --staged --quiet || git commit -m "discover: $(date +%Y-%m-%d) added new companies"
          git pull --rebase origin main
          git push
