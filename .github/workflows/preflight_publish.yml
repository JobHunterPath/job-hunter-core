name: Preflight and Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  packages: write

env:
  MINOR_ROLLOVER_LIMIT: 9

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "ruff>=0.4"
      - name: Check formatting
        run: ruff format --check src/ tests/
      - name: Check lint
        run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

  release:
    needs: [lint, test]
    runs-on: ubuntu-latest
    # Only runs in the upstream job-hunter-core repo; forks will skip it because
    # their repository name differs.
    # Also skips release-maintenance commits and the version-bump commit itself
    # to prevent re-triggering.
    if: |
      github.repository == 'JobHunterPath/job-hunter-core' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Determine bump type from conventional commits
        id: bump
        # Version bump policy (2-part MAJOR.MINOR):
        #   minor  — default for all commits; each push increments MINOR
        #   major  — breaking-change marker: trailing "!" on the type/scope, or "BREAKING CHANGE" in the body
        #            (e.g. "feat(scope)!: breaking change")
        #
        # Examples:
        #   feat(foo): add bar              → minor (1.0 → 1.1)
        #   fix(foo): repair bar            → minor (1.1 → 1.2)
        #   feat(foo)!: breaking bar        → major (1.9 → 2.0)
        #   BREAKING CHANGE: ...            → major
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --format="%s" HEAD)
          else
            COMMITS=$(git log --format="%s" "${LAST_TAG}..HEAD")
          fi
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          BUMP="minor"
          while IFS= read -r msg; do
            if echo "$msg" | grep -qE '^(feat|fix|refactor)(\(.+\))?!:|^BREAKING CHANGE'; then
              BUMP="major"
              break
            fi
          done <<< "$COMMITS"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        id: version
        # 2-part MAJOR.MINOR versioning.
        # Minor increments by default each push; major only on explicit breaking-change markers.
        # MINOR rolls over to the next major after MINOR_ROLLOVER_LIMIT.
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
          if [ -z "${{ steps.bump.outputs.last_tag }}" ]; then
            echo "new=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='.' read -r MAJOR MINOR _ <<< "$CURRENT"
          MINOR=${MINOR%%.*}
          case "${{ steps.bump.outputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0 ;;
            minor)
              MINOR=$((MINOR+1))
              if [ "$MINOR" -gt "$MINOR_ROLLOVER_LIMIT" ]; then
                MAJOR=$((MAJOR+1)); MINOR=0
              fi
              ;;
          esac
          echo "new=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "should_bump=true" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Bump pyproject.toml and push
        if: steps.version.outputs.should_bump == 'true'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.new }}"/' pyproject.toml
          git config user.name "Job Hunter"
          git config user.email "noreply@github.com"
          git add pyproject.toml
          git commit -m "chore: bump version to v${{ steps.version.outputs.new }}"
          git push

      - name: Create release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --generate-notes \
            --title "v${{ steps.version.outputs.new }}" \
            --target main

      - name: Post Discussion announcement
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "v${{ steps.version.outputs.new }}"
        run: |
          BODY=$(cat <<EOF
          ## $TAG is available

          Run the **Update From Template** workflow in your fork to pull the latest changes:

          > Actions -> \`Update From Template\` -> Run workflow

          See the [release notes](https://github.com/${{ github.repository }}/releases/tag/$TAG) for what changed.
          EOF
          )

          gh api graphql -f query='
            query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                id
                discussionCategories(first: 25) {
                  nodes { id name }
                }
              }
            }' \
            -f owner="${{ github.repository_owner }}" \
            -f name="${{ github.event.repository.name }}" \
            > /tmp/discussions.json

          REPO_ID=$(jq -r '.data.repository.id' /tmp/discussions.json)
          CATEGORY_ID=$(jq -r '
            .data.repository.discussionCategories.nodes
            | (map(select(.name == "Announcements"))[0] // .[0] // {})
            | .id // empty
          ' /tmp/discussions.json)

          if [ -z "$CATEGORY_ID" ]; then
            {
              echo "Discussion announcement skipped."
              echo "Repository discussion categories are not available for ${{ github.repository }}."
              echo
              echo "Post manually at: https://github.com/orgs/JobHunterPath/discussions"
              echo
              echo "Title: $TAG released"
              echo
              echo "$BODY"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api graphql -f query='
            mutation($repoId:ID!, $categoryId:ID!, $title:String!, $body:String!) {
              createDiscussion(input:{repositoryId:$repoId, categoryId:$categoryId, title:$title, body:$body}) {
                discussion { url }
              }
            }' \
            -f repoId="$REPO_ID" \
            -f categoryId="$CATEGORY_ID" \
            -f title="$TAG released" \
            -f body="$BODY" \
            --jq '.data.createDiscussion.discussion.url' \
            | tee /tmp/discussion_url.txt

          {
            echo "Discussion announcement created."
            echo
            echo "Org discussions: https://github.com/orgs/JobHunterPath/discussions"
            echo "Discussion: $(cat /tmp/discussion_url.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post cross-repo announcement to job-hunter-template
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_REPO_PAT }}
          TAG: "v${{ steps.version.outputs.new }}"
        run: |
          gh api graphql -f query='
            query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                id
                discussionCategories(first: 25) {
                  nodes { id name }
                }
              }
            }' \
            -f owner="JobHunterPath" \
            -f name="job-hunter-template" \
            > /tmp/template_discussions.json

          TEMPLATE_REPO_ID=$(jq -r '.data.repository.id' /tmp/template_discussions.json)
          TEMPLATE_CATEGORY_ID=$(jq -r '
            .data.repository.discussionCategories.nodes
            | (map(select(.name == "Announcements"))[0] // .[0] // {})
            | .id // empty
          ' /tmp/template_discussions.json)

          if [ -z "$TEMPLATE_CATEGORY_ID" ]; then
            {
              echo "job-hunter-template Discussion announcement skipped."
              echo "Repository discussion categories are not available for JobHunterPath/job-hunter-template."
              echo
              echo "Post manually at: https://github.com/JobHunterPath/job-hunter-template/discussions"
              echo
              echo "Title: $TAG released"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TEMPLATE_BODY=$(cat <<EOF
          ## $TAG is available

          Run the **Update From Template** workflow in your fork to pull the latest changes:

          > Actions -> \`Update From Template\` -> Run workflow

          See the [release notes](https://github.com/JobHunterPath/job-hunter-core/releases/tag/$TAG) for what changed.
          EOF
          )

          gh api graphql -f query='
            mutation($repoId:ID!, $categoryId:ID!, $title:String!, $body:String!) {
              createDiscussion(input:{repositoryId:$repoId, categoryId:$categoryId, title:$title, body:$body}) {
                discussion { url }
              }
            }' \
            -f repoId="$TEMPLATE_REPO_ID" \
            -f categoryId="$TEMPLATE_CATEGORY_ID" \
            -f title="$TAG released" \
            -f body="$TEMPLATE_BODY" \
            --jq '.data.createDiscussion.discussion.url' \
            | tee /tmp/template_discussion_url.txt

          {
            echo "job-hunter-template Discussion announcement created."
            echo
            echo "Discussion: $(cat /tmp/template_discussion_url.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-template:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: |
      github.repository == 'JobHunterPath/job-hunter-core' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !startsWith(github.event.head_commit.message, 'chore: bump version')
        )
      )
    steps:
      - name: Checkout job-hunter-core
        uses: actions/checkout@v5

      - name: Checkout job-hunter-template
        uses: actions/checkout@v5
        with:
          repository: JobHunterPath/job-hunter-template
          token: ${{ secrets.TEMPLATE_REPO_PAT }}
          path: job-hunter-template

      - name: Sync maintained template files
        run: python .github/scripts/build_template_repo.py job-hunter-template

      - name: Open PR in job-hunter-template
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TEMPLATE_REPO_PAT }}
          path: job-hunter-template
          commit-message: "chore: sync template files from job-hunter-core"
          branch: sync/from-core-${{ github.run_id }}
          title: "chore: sync template updates from job-hunter-core"
          body: |
            Automated sync of maintained template files from job-hunter-core.

            Source commit: ${{ github.sha }}
          delete-branch: true

  build-runner-image:
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: |
      github.repository == 'JobHunterPath/job-hunter-core' &&
      (
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'chore(release):') &&
          !startsWith(github.event.head_commit.message, 'chore: bump version')
        )
      )

    env:
      IMAGE_NAME: ghcr.io/jobhunterpath/job-hunter-core

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          version="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE_NAME, github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.title=job-hunter-core
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Job hunt runner image
