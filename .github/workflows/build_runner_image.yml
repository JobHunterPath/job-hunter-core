name: Publish Runner Image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - ".github/workflows/build_runner_image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jobhunterpath/job-hunter-core

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.repository == 'JobHunterPath/job-hunter-core' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          version="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE_NAME, github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.title=job-hunter-core
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Job hunt runner image
